<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supreme King - Shadow Garden</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Quicksand:wght@400;700&display=swap');
        
        body {
            background: radial-gradient(circle at center, #1a0b2e 0%, #040714 100%);
            color: #e0e7ff;
            font-family: 'Quicksand', sans-serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding: 40px 20px; margin: 0;
        }

        .fantasy-title {
            font-family: 'Cinzel Decorative', cursive;
            color: #fcd34d;
            text-shadow: 0 0 20px rgba(167, 139, 250, 0.8);
            text-align: center;
        }

        .link-card {
            width: 100%; max-width: 480px;
            background: rgba(10, 10, 20, 0.9);
            border: 2px solid #6d28d9;
            padding: 20px; margin: 12px 0; border-radius: 15px;
            display: flex; flex-direction: column; gap: 10px;
            text-decoration: none; color: white;
            transition: 0.3s;
        }

        .link-card:hover {
            transform: scale(1.02);
            border-color: #fcd34d;
            box-shadow: 0 0 25px rgba(167, 139, 250, 0.4);
        }

        .yt-name { font-weight: 900; font-size: 1.2rem; color: #fff; }
        .yt-desc { font-size: 0.85rem; color: #ccc; white-space: pre-line; }

        /* Estilo del Contador */
        .visitor-counter {
            margin-top: 30px;
            padding: 15px;
            background: rgba(109, 40, 217, 0.15);
            border-radius: 10px;
            border: 1px dashed #6d28d9;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="mb-8">
        <h1 class="fantasy-title text-4xl">Supreme King</h1>
        <p class="text-center text-purple-400 text-xs tracking-widest mt-1 italic">モルガナ・D・オスクリダ</p>
    </div>

    <a href="https://www.youtube.com/@DarkMorgana23" target="_blank" class="link-card">
        <div class="flex items-center gap-3">
            <i class="fab fa-youtube text-red-600 text-2xl"></i>
            <p class="yt-name">Supreme King (oscuro)</p>
        </div>
        <div class="yt-desc text-xs">Tu universo geek en un solo lugar. 🌙 Shadow Garden Member.</div>
    </a>

    <a href="https://www.tiktok.com/@elincia_morgana" target="_blank" class="link-card" style="flex-direction: row; border-color: #a78bfa;">
        <i class="fab fa-tiktok text-2xl text-purple-400"></i>
        <span class="font-bold">TikTok Shadow Chronicles</span>
    </a>

    <a href="https://www.amazon.es/hz/wishlist/ls/IHLZMVZV9HPD?ref_=wl_share" target="_blank" class="link-card" style="flex-direction: row; border-color: #fcd34d;">
        <i class="fas fa-gem text-2xl text-yellow-500"></i>
        <span class="font-bold">Inventario de Poder (Amazon)</span>
    </a>

    <div class="visitor-counter">
        <p class="text-[10px] text-purple-400 uppercase tracking-[3px] mb-2 font-bold">Legión de Sombras Detectada:</p>
        <img src="https://hits.seeyoufarm.com/api/count/incr/badge.svg?url=https%3A%2F%2Fonepiece102057-ai.github.io%2FMundolinks%2F&count_bg=%236D28D9&title_bg=%231A0B2E&icon=opsgenie.svg&icon_color=%23FCD34D&title=SOLDADOS&edge_flat=false" alt="Visitas"/>
    </div>

    <p class="mt-10 text-[9px] text-purple-900 font-black tracking-widest uppercase">Shadow Garden Operation</p>

</body>
</html>
