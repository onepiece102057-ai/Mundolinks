<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosa Insana Memes - Menú Legendario</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;900&display=swap');

        body {
            background: #0c0605;
            /* Fondo degradado estilo volcánico como tu imagen */
            background-image: radial-gradient(circle at center, #422016 0%, #0c0605 100%);
            font-family: 'Outfit', sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            margin: 0;
        }

        /* Marco de Héroe estilo Hearthstone */
        .hero-container {
            position: relative;
            margin-bottom: 30px;
        }

        .hero-portrait {
            width: 130px;
            height: 130px;
            border-radius: 50% 50% 15% 15%;
            border: 6px solid #fcd34d;
            box-shadow: 0 0 30px rgba(255, 109, 0, 0.6), inset 0 0 20px rgba(0,0,0,0.8);
            object-fit: cover;
            background: #2d1b15;
        }

        .level-badge {
            position: absolute;
            bottom: -10px;
            right: -10px;
            background: #ff6d00;
            color: white;
            font-weight: 900;
            padding: 5px 12px;
            border-radius: 8px;
            border: 3px solid #fcd34d;
            font-size: 14px;
            text-shadow: 1px 1px 2px black;
        }

        .title-insano {
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            font-size: 1.8rem;
            letter-spacing: -1px;
            color: #fcd34d;
            text-shadow: 3px 3px 0px #3e2723, 0 0 10px rgba(252, 211, 77, 0.5);
            margin-bottom: 5px;
        }

        /* Botones estilo Carta de Hechizo/Esbirro */
        .link-card {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(135deg, #3e2723 0%, #1a0f0a 100%);
            border: 3px solid #8d6e63;
            padding: 20px;
            margin: 12px 0;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            text-decoration: none;
            color: white;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .link-card:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: #fcd34d;
            box-shadow: 0 0 30px rgba(252, 211, 77, 0.3), 0 15px 30px rgba(0,0,0,0.7);
            background: linear-gradient(135deg, #5d4037 0%, #2d1b15 100%);
        }

        /* Efecto de brillo "Legendario" */
        .link-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: 0.5s;
        }

        .link-card:hover::before {
            left: 200%;
        }

        .card-icon-box {
            width: 50px;
            height: 50px;
            background: #2d1b15;
            border: 2px solid #fcd34d;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #fcd34d;
            flex-shrink: 0;
        }

        .card-info {
            flex-grow: 1;
        }

        .card-title {
            display: block;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 1rem;
            color: #fcd34d;
        }

        .card-desc {
            display: block;
            font-size: 0.75rem;
            color: #a1a1aa;
            font-weight: 600;
        }

        .rarity-gem {
            width: 12px;
            height: 12px;
            background: #ff6d00; /* Legendario */
            border-radius: 50%;
            box-shadow: 0 0 10px #ff6d00;
        }
    </style>
</head>
<body>

    <div class="hero-container">
        <img src="https://unavatar.io/instagram/cosainsanamemes" alt="Avatar" class="hero-portrait">
        <div class="level-badge">99</div>
    </div>

    <h1 class="title-insano">@COSAINSANAMEMES</h1>
    <p class="text-orange-400/80 text-[10px] font-black uppercase tracking-[4px] mb-8">Creador de Contenido Legendario</p>

    <a href="https://www.amazon.com" target="_blank" class="link-card">
        <div class="card-icon-box"><i class="fas fa-bolt"></i></div>
        <div class="card-info">
            <span class="card-title">Setup Insano</span>
            <span class="card-desc">Lo que uso para mis videos</span>
        </div>
        <div class="rarity-gem"></div>
    </a>

    <a href="#" class="link-card">
        <div class="card-icon-box"><i class="fas fa-wand-magic-sparkles"></i></div>
        <div class="card-info">
            <span class="card-title">Studio IA Privado</span>
            <span class="card-desc">Crea tus propios memes pro</span>
        </div>
        <div class="rarity-gem" style="background: #a855f7; box-shadow: 0 0 10px #a855f7;"></div>
    </a>

    <a href="mailto:tu-correo@gmail.com" class="link-card">
        <div class="card-icon-box"><i class="fas fa-handshake"></i></div>
        <div class="card-info">
            <span class="card-title">Business / Publicidad</span>
            <span class="card-desc">Colaboraciones y marcas</span>
        </div>
        <div class="rarity-gem" style="background: #3b82f6; box-shadow: 0 0 10px #3b82f6;"></div>
    </a>

    <a href="https://youtube.com" target="_blank" class="link-card" style="border-color: #ff003c;">
        <div class="card-icon-box" style="border-color: #ff003c;"><i class="fab fa-youtube" style="color: #ff003c;"></i></div>
        <div class="card-info">
            <span class="card-title" style="color: #ff003c;">YouTube</span>
            <span class="card-desc">Clips extendidos y más</span>
        </div>
    </a>

    <div class="mt-10 opacity-40 flex gap-6">
        <i class="fab fa-instagram text-xl"></i>
        <i class="fab fa-tiktok text-xl"></i>
        <i class="fab fa-discord text-xl"></i>
    </div>
    <p class="mt-6 text-[9px] text-zinc-600 font-bold uppercase tracking-[3px]">Powered by Otaku 24/7 Engine</p>

</body>
</html>
