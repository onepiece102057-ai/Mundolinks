<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elincia Isekai Voyage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Quicksand:wght@400;700&display=swap');
        body {
            background: radial-gradient(circle at center, #1a0b2e 0%, #040714 100%);
            color: #e0e7ff;
            font-family: 'Quicksand', sans-serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding: 50px 20px; margin: 0;
        }
        .fantasy-title {
            font-family: 'Cinzel Decorative', cursive;
            color: #fcd34d;
            text-shadow: 0 0 15px rgba(252, 211, 77, 0.6);
            text-align: center; line-height: 1.2;
        }
        .link-card {
            width: 100%; max-width: 400px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #6366f1;
            padding: 20px; margin: 12px 0; border-radius: 15px;
            display: flex; align-items: center; gap: 15px;
            text-decoration: none; color: white;
            transition: 0.3s;
        }
        .link-card:hover {
            transform: scale(1.05);
            background: rgba(99, 102, 241, 0.2);
            border-color: #fcd34d;
        }
        .icon-box { font-size: 1.8rem; min-width: 40px; text-align: center; }
        
        .yt-icon { color: #FF0000; }
        .tt-icon { color: #00f2ea; }
        .amz-icon { color: #fcd34d; }
    </style>
</head>
<body>
    <div class="mb-10">
        <h1 class="fantasy-title text-5xl">ELINCIA</h1>
        <h2 class="fantasy-title text-2xl" style="color: #a78bfa;">ISEKAI VOYAGE</h2>
    </div>

    <a href="https://www.tiktok.com/@elincia_morgana" target="_blank" class="link-card">
        <div class="icon-box tt-icon"><i class="fab fa-tiktok"></i></div>
        <div>
            <p class="font-bold text-lg">TikTok de la Capitana</p>
            <p class="text-sm text-indigo-300">Nuestros viajes por el portal.</p>
        </div>
    </a>

    <a href="https://www.youtube.com/@DarkMorgana23" target="_blank" class="link-card" style="border-color: rgba(255, 0, 0, 0.4);">
        <div class="icon-box yt-icon"><i class="fab fa-youtube"></i></div>
        <div>
            <p class="font-bold text-lg">YouTube Chronicles</p>
            <p class="text-sm text-red-300">Vídeos largos y directos de Dark Morgana.</p>
        </div>
    </a>

    <a href="https://www.amazon.es/hz/wishlist/ls/IHLZMVZV9HPD?ref_=wl_share" target="_blank" class="link-card" style="border-color: #fcd34d; box-shadow: 0 0 15px rgba(252, 211, 77, 0.3);">
        <div class="icon-box amz-icon"><i class="fas fa-gem"></i></div>
        <div>
            <p class="font-bold text-lg">Cofre de Botín Gaming</p>
            <p class="text-sm text-yellow-200">Inventario legendario para tu setup.</p>
        </div>
    </a>

    <p class="mt-20 text-[10px] uppercase tracking-widest text-indigo-500">© 2026 Elincia Isekai Voyage</p>
</body>
</html>
