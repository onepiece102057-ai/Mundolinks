<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosa Insana - Enlaces Legendarios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;900&display=swap');
        
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            background: linear-gradient(-45deg, #0c0605, #422016, #1a0f0a, #0c0605);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: 'Outfit', sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            margin: 0;
        }

        .hero-portrait {
            width: 130px;
            height: 130px;
            border-radius: 50% 50% 15% 15%;
            border: 6px solid #fcd34d;
            box-shadow: 0 0 30px rgba(255, 109, 0, 0.6);
            object-fit: cover;
        }

        @keyframes glowing {
            0% { border-color: #8d6e63; box-shadow: 0 0 5px #3e2723; }
            50% { border-color: #fcd34d; box-shadow: 0 0 25px rgba(252, 211, 77, 0.8); }
            100% { border-color: #8d6e63; box-shadow: 0 0 5px #3e2723; }
        }

        .link-card {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(135deg, #3e2723 0%, #1a0f0a 100%);
            border: 3px solid #8d6e63;
            padding: 20px;
            margin: 12px 0;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
            color: white;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .legendary {
            animation: glowing 1.5s infinite;
            border-width: 4px;
        }

        .link-card:hover {
            transform: scale(1.05);
            border-color: #fcd34d;
        }

        .card-title { font-weight: 900; color: #fcd34d; text-transform: uppercase; font-size: 1.1rem; }
        .card-desc { font-size: 0.8rem; color: #a1a1aa; font-weight: 600; }
    </style>
</head>
<body>

    <img src="https://unavatar.io/instagram/cosainsanamemes" class="hero-portrait" alt="Cosa Insana">
    <h1 class="text-2xl font-black mt-4 text-[#fcd34d] italic uppercase">@COSAINSANAMEMES</h1>
    <p class="text-[10px] tracking-[4px] uppercase mb-8 text-orange-500 font-bold">Nivel 99 - Modo Sabio Activo</p>

    <a href="https://amzn.to/40LzfnM" target="_blank" class="link-card legendary">
        <div class="w-12 h-12 flex items-center justify-center bg-[#2d1b15] border-2 border-[#fcd34d] rounded-lg text-[#fcd34d] text-2xl">
            <i class="fas fa-bolt"></i>
        </div>
        <div>
            <span class="card-title">Energía Modo Sabio 🍜</span>
            <p class="card-desc">El pre-entreno de Naruto que uso para mis videos.</p>
        </div>
    </a>

    <a href="mailto:tu-correo@gmail.com" class="link-card">
        <div class="w-12 h-12 flex items-center justify-center bg-[#2d1b15] border-2 border-[#8d6e63] rounded-lg text-[#8d6e63] text-2xl">
            <i class="fas fa-scroll"></i>
        </div>
        <div>
            <span class="card-title">Misiones / Business</span>
            <p class="card-desc">Contacto para publicidad y marcas.</p>
        </div>
    </a>

    <p class="mt-10 text-[8px] text-zinc-600 font-bold uppercase tracking-[3px]">Powered by Cosa Insana Engine</p>

</body>
</html>
