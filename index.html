<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supreme King - Shadow Garden</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Quicksand:wght@400;700&display=swap');
        
        body {
            background: radial-gradient(circle at center, #1a0b2e 0%, #040714 100%);
            color: #e0e7ff;
            font-family: 'Quicksand', sans-serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding: 40px 20px; margin: 0;
        }

        .fantasy-title {
            font-family: 'Cinzel Decorative', cursive;
            color: #fcd34d;
            text-shadow: 0 0 20px rgba(167, 139, 250, 0.8);
            text-align: center;
        }

        .link-card {
            width: 100%; max-width: 480px;
            background: rgba(10, 10, 20, 0.9);
            border: 2px solid #6d28d9;
            padding: 18px; margin: 10px 0; border-radius: 15px;
            display: flex; flex-direction: column; gap: 8px;
            text-decoration: none; color: white;
            transition: 0.3s;
        }

        .link-card:hover {
            transform: scale(1.02);
            border-color: #fcd34d;
            box-shadow: 0 0 25px rgba(167, 139, 250, 0.4);
        }

        .sub-link {
            display: inline-block;
            background: rgba(109, 40, 217, 0.3);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.8rem;
            border: 1px solid #6d28d9;
            margin-right: 6px;
            margin-top: 8px;
            transition: 0.2s;
            font-weight: 600;
        }
        .sub-link:hover { background: #6d28d9; color: #fff; transform: translateY(-2px); }

        .prime-btn { background: #00A8E1; border: none; color: white; }
        .prime-btn:hover { background: #0082b1; }
    </style>
</head>
<body>

    <div class="mb-8 text-center">
        <h1 class="fantasy-title text-4xl uppercase">Supreme King</h1>
        <p class="text-purple-400 text-[10px] tracking-[4px] mt-1 font-bold">SHADOW GARDEN OPERATIONS</p>
    </div>

    <a href="https://www.youtube.com/@DarkMorgana23" target="_blank" class="link-card">
        <div class="flex items-center gap-3">
            <i class="fab fa-youtube text-red-600 text-2xl"></i>
            <span class="font-bold">Supreme King (oscuro)</span>
        </div>
        <p class="text-[11px] text-gray-400">El Rincón del Friki: Tu universo geek.</p>
    </a>

    <div class="link-card" style="border-color: #fcd34d; background: rgba(20, 10, 30, 0.95);">
        <div class="flex items-center gap-3 mb-1">
            <i class="fas fa-tools text-yellow-400 text-xl"></i>
            <span class="font-bold text-yellow-400">Forja de Contenido Pro</span>
        </div>
        <p class="text-[11px] text-purple-200">Usa las herramientas de la Capitana para tus creaciones:</p>
        
        <div class="flex flex-wrap">
            <a href="https://suno.com/create" target="_blank" class="sub-link">🎵 Suno Music</a>
            <a href="https://sousaku.ai/es" target="_blank" class="sub-link">🎨 Sousaku Art</a>
            
            <a href="https://amzn.to/4b096I0" target="_blank" class="sub-link prime-btn">💎 Amazon Prime FREE</a>
            
            <a href="https://www.amazon.es/hz/wishlist/ls/IHLZMVZV9HPD?ref_=wl_share" target="_blank" class="sub-link" style="border-color: #fcd34d;">⚔️ Mi Setup</a>
        </div>
    </div>

    <a href="https://www.tiktok.com/@elincia_morgana" target="_blank" class="link-card">
        <div class="flex items-center gap-3">
            <i class="fab fa-tiktok text-purple-400 text-2xl"></i>
            <span class="font-bold">Shadow Chronicles</span>
        </div>
    </a>

    <div class="mt-10 opacity-80">
        <img src="https://hits.seeyoufarm.com/api/count/incr/badge.svg?url=https%3A%2F%2Fonepiece102057-ai.github.io%2FMundolinks%2F&count_bg=%236D28D9&title_bg=%231A0B2E&icon=opsgenie.svg&icon_color=%23FCD34D&title=SOLDADOS&edge_flat=false" alt="Visitas"/>
    </div>

</body>
</html>
